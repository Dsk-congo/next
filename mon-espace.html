<script>
(function () {
  var S = window.NGStore, U = window.NGUtil, esc = U.esc;
  var session = null;
  try { session = JSON.parse(localStorage.getItem("ng_session")); } catch (e) {}
  if (!session) { location.replace("connexion.html"); return; }
  var tel = (localStorage.getItem("ng_client_tel") || (/^\+?\d[\d\s]+$/.test(session.identifiant || "") ? session.identifiant : "")).replace(/[^\d]/g, "");
  var email = /@/.test(session.identifiant || "") ? session.identifiant.toLowerCase() : "";
  var nom = (session.nom || "").toLowerCase();
  document.getElementById("bonjour").textContent = "Bonjour " + session.nom;
  document.getElementById("deconnexion").addEventListener("click", function () { localStorage.removeItem("ng_session"); location.href = "index.html"; });
  function norm(t) { return String(t || "").replace(/[^\d]/g, ""); }
  try { if (!sessionStorage.getItem("ng_vu_client") && S.liste("comptes_clients").some(function (c) { return c.id === session.id; })) { S.modifier("comptes_clients", session.id, { derniereConnexion: new Date().toISOString() }); sessionStorage.setItem("ng_vu_client", "1"); } } catch (e) {}
  /* Fenêtre simple (dialog) */
  function fenetre(titre, html, brancher) {
    var d = document.createElement("dialog"); d.className = "modal cli-dlg";
    d.innerHTML = '<div class="modal-head"><h2>' + titre + '</h2><button type="button" class="tiroir-fermer" data-x aria-label="Fermer">✕</button></div><div class="modal-body">' + html + "</div>";
    document.body.appendChild(d); d.showModal();
    var fermer = function () { d.close(); d.remove(); };
    d.querySelector("[data-x]").addEventListener("click", fermer); d.addEventListener("cancel", function () { d.remove(); });
    brancher(d, fermer);
  }
  /* Zone de signature au doigt ou à la souris */
  function zoneSignature(cv) {
    var ctx, trace = false, dessine = false;
    var taille = function () { var r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; ctx = cv.getContext("2d"); ctx.scale(devicePixelRatio, devicePixelRatio); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.strokeStyle = "#0B1033"; };
    setTimeout(taille, 30);
    var pt = function (e) { var r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener("pointerdown", function (e) { dessine = trace = true; cv.setPointerCapture(e.pointerId); var q = pt(e); ctx.beginPath(); ctx.moveTo(q[0], q[1]); });
    cv.addEventListener("pointermove", function (e) { if (!dessine) return; var q = pt(e); ctx.lineTo(q[0], q[1]); ctx.stroke(); });
    cv.addEventListener("pointerup", function () { dessine = false; });
    return { vide: function () { return !trace; }, effacer: function () { ctx.clearRect(0, 0, cv.width, cv.height); trace = false; }, image: function () { return cv.toDataURL("image/png"); } };
  }
  function etoiles(nom) { return '<div class="etoiles" role="radiogroup" aria-label="Note">' + [5, 4, 3, 2, 1].map(function (n) { return '<input type="radio" id="' + nom + n + '" name="' + nom + '" value="' + n + '"><label for="' + nom + n + '" title="' + n + ' sur 5">★</label>'; }).join("") + "</div>"; }
  /* Avis de satisfaction après un ticket ou une intervention */
  function demanderAvis(col, obj, quoi) {
    fenetre("Votre avis compte", "<p>Comment s’est passée " + esc(quoi) + " ?</p>" + etoiles("note") + '<label class="field">Un commentaire (facultatif)<textarea name="com" style="min-height:80px" placeholder="Rapidité, qualité, accueil du technicien…"></textarea></label><p class="error-text" hidden data-err>Choisissez une note.</p><button class="btn btn-primary" type="button" data-ok>Envoyer mon avis</button>', function (d, fermer) {
      d.querySelector("[data-ok]").addEventListener("click", function () {
        var n = d.querySelector("[name=note]:checked"); if (!n) { d.querySelector("[data-err]").hidden = false; return; }
        var avis = { note: Number(n.value), commentaire: d.querySelector("[name=com]").value.trim(), date: new Date().toISOString(), par: session.nom };
        if (col === "demandes") S.majDemande(obj.id, { avis: avis }); else S.modifier(col, obj.id, { avis: avis });
        S.log("Avis client " + avis.note + "/5", (obj.id || "") + " · " + session.nom + (avis.commentaire ? " · « " + avis.commentaire.slice(0, 60) + " »" : ""));
        fermer(); ouvrir(document.querySelector("#tabs-espace [aria-selected=true]").dataset.t);
        alert("Merci pour votre avis !");
      });
    });
  }
  setTimeout(function () { var c0 = S.liste("comptes_clients").filter(function (c) { return c.id === session.id; })[0]; if (c0 && c0.langue && window.NGLangue && window.NGLangue.actuelle() !== c0.langue) window.NGLangue.choisir(c0.langue); }, 0);
  function compte() { return S.liste("comptes_clients").filter(function (c) { return c.id === session.id; })[0] || { id: session.id, nom: session.nom, identifiant: session.identifiant }; }
  function lie(x) { return (tel && norm(x.telephone) === tel) || (email && String(x.email || "").toLowerCase() === email) || (nom.length > 2 && [x.nom, x.entreprise, x.clientNom, x.contact].some(function (n) { return String(n || "").toLowerCase() === nom; })); }
  function argent(n) { return "$\u00a0" + Number(n || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function jour(d) { return d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : "—"; }
  function totaux(d) { var t = S.reglages().tva, st = (d.lignes || []).reduce(function (a, l) { return a + l.qte * l.pu; }, 0); return { ht: st, ttc: st * (1 + t / 100), taux: t }; }
  function paye(f) { return S.liste("paiements").filter(function (p) { return p.factureId === f.id; }).reduce(function (a, p) { return a + Number(p.montant); }, 0); }
  function donnees() {
    var D = S.demandes().filter(lie);
    var ids = D.map(function (d) { return d.clientId; }).filter(Boolean);
    var lie2 = function (x) { return lie(x) || (x.clientId && ids.indexOf(x.clientId) > -1) || (x.demandeId && D.some(function (d) { return d.id === x.demandeId; })); };
    return { D: D, F: S.liste("factures").filter(lie2), AB: S.liste("abonnements").filter(lie2), PR: S.liste("projets").filter(lie2), T: S.liste("tickets").filter(lie2) };
  }
  function vide(titre, texte, lien, label) { return '<div class="card"><h2 style="font-size:1.25rem">' + titre + "</h2><p>" + texte + "</p>" + (lien ? '<a class="btn btn-primary" href="' + lien + '" style="align-self:flex-start">' + label + "</a>" : "") + "</div>"; }
  var LIBD = { a_evaluer: ["En évaluation", "tag-accent"], devis_envoye: ["Devis reçu", "tag-warn"], accepte: ["Accepté", "tag-ok"], paye: ["Payé", "tag-ok"], cloture: ["Terminé", "tag-muted"], refuse: ["Refusé", "tag-muted"] };
  var LIBF = { emise: ["À payer", "tag-warn"], partielle: ["Partiellement payée", "tag-accent"], payee: ["Payée", "tag-ok"], annulee: ["Annulée", "tag-muted"], proforma: ["Pro-forma", "tag-accent"] };
  var SLA = { critique: 4, haute: 8, normale: 24, basse: 72 };
  var LIBT = { nouveau: "Reçu", assigne: "Technicien assigné", encours: "En cours", resolu: "Résolu", ferme: "Fermé" };
  function avProjet(p) { var j = p.jalons || []; return j.length ? Math.round(j.filter(function (x) { return x.fait; }).length / j.length * 100) : 0; }

  function anneau(pc, centre, couleur) {
    var r = 52, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pc || 0));
    return '<svg class="g-anneau" viewBox="0 0 130 130" role="img" aria-label="' + esc(centre + " " + Math.round(v) + " %") + '"><circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="13"/><circle cx="65" cy="65" r="' + r + '" fill="none" stroke="' + (couleur || "var(--accent)") + '" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + (c * v / 100).toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 65 65)"/><text x="65" y="62" text-anchor="middle" class="g-val">' + Math.round(v) + ' %</text><text x="65" y="82" text-anchor="middle" class="g-lbl">' + esc(centre) + "</text></svg>";
  }
  function barres(items) {
    var max = Math.max.apply(null, items.map(function (i) { return i.val; }).concat([1]));
    return '<div class="g-barres">' + items.map(function (i) { return '<div class="g-col" title="' + esc(i.label) + '"><span class="g-v">' + (i.val ? argent(i.val).replace(",00", "") : "") + '</span><span class="g-b" style="height:' + Math.max(3, Math.round(i.val / max * 100)) + '%"></span><span class="g-l">' + esc(i.court) + "</span></div>"; }).join("") + "</div>";
  }
  function profil() {
    var c = compte();
    document.getElementById("cli-profil").innerHTML = '<button type="button" class="cli-photo" data-aller="compte" title="Changer ma photo">' + window.NGPhoto.avatar(c, 52) + '</button><div><strong>' + esc(c.nom || session.nom) + "</strong><small>" + esc(c.entreprise || "Client NextGenIT") + "</small><small>" + esc(c.telephone || c.identifiant || "") + "</small></div>";
    document.querySelector("#cli-profil [data-aller]").addEventListener("click", function () { ouvrir("compte"); });
    var X = donnees(), n = function (id, v) { var el = document.getElementById("n-" + id); if (el) { el.textContent = v || ""; el.hidden = !v; } };
    n("devis", X.D.filter(function (d) { return d.statut === "devis_envoye"; }).length);
    n("factures", X.F.filter(function (f) { return f.type !== "proforma" && ["emise", "partielle"].indexOf(f.statut) > -1; }).length);
    n("support", X.T.filter(function (t) { return t.statut === "resolu"; }).length);
    n("projets", X.PR.reduce(function (a, p) { return a + (p.jalons || []).filter(function (j) { return j.fait && !j.valideClient; }).length; }, 0));
  }
  function bord() {
    var X = donnees(), c = compte();
    var factures = X.F.filter(function (f) { return f.type !== "proforma" && f.statut !== "annulee"; });
    var total = factures.reduce(function (a, f) { return a + f.ttc; }, 0), regle = factures.reduce(function (a, f) { return a + Math.min(f.ttc, paye(f)); }, 0);
    var aPayer = factures.filter(function (f) { return ["emise", "partielle"].indexOf(f.statut) > -1; });
    var du = total - regle, tOuv = X.T.filter(function (t) { return ["resolu", "ferme"].indexOf(t.statut) < 0; });
    var projMoy = X.PR.length ? Math.round(X.PR.reduce(function (a, p) { return a + avProjet(p); }, 0) / X.PR.length) : 0;
    var tRes = X.T.length ? Math.round(X.T.filter(function (t) { return ["resolu", "ferme"].indexOf(t.statut) > -1; }).length / X.T.length * 100) : 0;
    var P = S.liste("paiements").filter(function (p) { return factures.some(function (f) { return f.id === p.factureId; }); });
    var mois = []; for (var i = 5; i >= 0; i--) { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); var k = d.toISOString().slice(0, 7); mois.push({ label: d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" }), court: d.toLocaleDateString("fr-FR", { month: "short" }), val: P.filter(function (p) { return String(p.date).slice(0, 7) === k; }).reduce(function (a, p) { return a + Number(p.montant); }, 0) }); }
    var afaire = [];
    X.D.filter(function (d) { return d.statut === "devis_envoye"; }).forEach(function (d) { afaire.push(["📄", "Devis à valider : " + (d.services || []).join(", "), "devis"]); });
    aPayer.forEach(function (f) { afaire.push(["💳", "Facture " + f.numero + " : reste " + argent(Math.max(0, f.ttc - paye(f))), "factures"]); });
    X.T.filter(function (t) { return t.statut === "resolu"; }).forEach(function (t) { afaire.push(["✔", "Confirmez la résolution du ticket " + t.id, "support"]); });
    X.T.filter(function (t) { return ["resolu", "ferme"].indexOf(t.statut) > -1 && !t.avis; }).slice(0, 2).forEach(function (t) { afaire.push(["★", "Notez l’intervention du ticket " + t.id, "support"]); });
    X.D.filter(function (d) { return (d.statut === "cloture" || d.etape === "termine") && !d.avis; }).slice(0, 2).forEach(function (d) { afaire.push(["★", "Notez l’intervention " + d.id, "avis:" + d.id]); });
    X.PR.forEach(function (p) { (p.jalons || []).filter(function (j) { return j.fait && !j.valideClient; }).forEach(function (j) { afaire.push(["🏁", "Validez l’étape « " + j.nom + " » (" + p.nom + ")", "projets"]); }); });
    var depuis = c.creeLe ? new Date(c.creeLe).toLocaleDateString("fr-FR", { month: "long", year: "numeric" }) : "";
    var activite = [];
    X.D.forEach(function (d) { activite.push({ d: d.creeLe, ico: "📄", t: "Demande " + d.id + " : " + (d.services || []).join(", "), lien: "devis" }); });
    P.forEach(function (p) { activite.push({ d: p.date, ico: "💳", t: "Paiement de " + argent(p.montant) + " (" + p.mode + ")", lien: "factures" }); });
    X.T.forEach(function (t) { (t.historique || [{ date: t.creeLe, texte: "Ticket créé" }]).filter(function (h) { return !h.interne; }).forEach(function (h) { activite.push({ d: h.date, ico: "🎫", t: t.id + " · " + (h.texte || ""), lien: "support" }); }); });
