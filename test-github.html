<!doctype html>
<html lang="fr" data-theme="pro" data-skin="pro">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Diagnostic de mise en ligne – NextGenIT</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="style.css?v=48">
<link rel="stylesheet" href="pro.css?v=48">
<link rel="stylesheet" href="marque.css?v=48">
<link rel="stylesheet" href="design.css?v=48">
<script src="firebase-config.js?v=48"></script>
<script src="theme.js?v=48"></script>
<script src="app.js?v=48" defer></script>
<script type="module" src="cloud.js?v=48"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 28px 16px; background: #f3f7fd; color: #152033; }
  .boite { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.8rem; margin: 0 0 6px; }
  .ligne { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; padding: 14px 16px; margin-top: 10px; border-radius: 14px; background: #fff; border: 1px solid #e3e9f2; }
  .ligne b { display: block; }
  .ligne small { color: #5d6b82; }
  .ok .p { background: #16a34a; } .ko .p { background: #c1121f; } .att .p { background: #f59e0b; }
  .p { width: 30px; height: 30px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 800; }
  code { background: #eef3fb; padding: 2px 6px; border-radius: 6px; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#081631">
<link rel="apple-touch-icon" href="assets/img/app-192.png">
</head>
<body>
<main class="boite">
  <h1>Diagnostic de mise en ligne</h1>
  <p>Cette page vérifie que tous les fichiers sont bien en place sur GitHub et que Firebase répond. Elle n’apparaît dans aucun menu.</p>
  <div id="res"></div>
  <p style="margin-top:22px"><a href="index.html">← Site public</a> · <a href="admin.html">Administration</a></p>
</main>
<script src="contenu.js?v=48"></script>
<script src="store.js?v=48"></script>
<script>
(function () {
  var res = document.getElementById("res");
  function ligne(etat, titre, detail) { return '<div class="ligne ' + etat + '"><span class="p">' + (etat === "ok" ? "✓" : etat === "ko" ? "✕" : "…") + "</span><div><b>" + titre + "</b><small>" + detail + "</small></div></div>"; }
  function verifier() {
    var h = [];
    var css = getComputedStyle(document.documentElement).getPropertyValue("--navy").trim();
    h.push(css ? ligne("ok", "Feuilles de style (design)", "style.css?v=32 et pro.css sont chargées.") : ligne("ko", "Feuilles de style introuvables", "Les fichiers <code>style.css</code> et <code>pro.css</code> doivent être à la racine du dépôt GitHub, à côté de <code>index.html</code> (comme dans le projet DSK)."));
    h.push(window.NG_CONTENU && window.NGStore ? ligne("ok", "Scripts du site", "contenu.js et store.js sont chargés.") : ligne("ko", "Scripts introuvables", "Les fichiers <code>contenu.js</code> et <code>store.js</code> doivent être à la racine du dépôt, à côté de <code>index.html</code>."));
    var F = window.NG_FIREBASE || {};
    h.push(F.apiKey ? ligne("ok", "Configuration Firebase", "Projet : <code>" + F.projectId + "</code>") : ligne("ko", "Firebase non configuré", "Remplissez <code>firebase-config.js?v=32</code>."));
    var c = window.NGCloud;
    if (!F.apiKey) {}
    else if (!c) h.push(ligne("att", "Connexion à Firebase…", "Patientez quelques secondes."));
    else if (c.actif) {
      var n = 0; for (var i = 0; i < localStorage.length; i++) if (localStorage.key(i).indexOf("ng_") === 0) n++;
      h.push(ligne("ok", "Firebase connecté : l’admin et le site public communiquent", n + " jeux de données synchronisés dans la collection <code>nextgenit</code>."));
    } else h.push(ligne("ko", "Firebase ne répond pas", (c.erreur || "Erreur inconnue") + "<br>Vérifiez les règles Firestore (voir LISEZ-MOI) et que <code>" + location.hostname + "</code> est autorisé."));
    h.push(ligne(location.protocol === "file:" ? "ko" : "ok", "Adresse du site", location.protocol === "file:" ? "Le site est ouvert comme fichier : publiez-le sur GitHub Pages ou lancez un petit serveur." : location.href.replace(/test-github\.html.*$/, "")));
    res.innerHTML = h.join("");
  }
  verifier();
  window.addEventListener("ng-cloud", verifier);
  setTimeout(verifier, 4000);
})();
</script>
</body>
</html>
