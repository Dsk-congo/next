  /* Signature et sceau : en filigrane, DERRIÈRE le texte */
  .bc-sign { position: absolute; left: 0; right: 0; bottom: 6mm; height: 18mm; z-index: 0; pointer-events: none; }

<script>
/* Le document s'affiche dans la langue du client (choisie dans son compte ou par l'administration) */
(function () {
  var p = new URLSearchParams(location.search), l = p.get("lang");
  if (!l) {
    try {
      var S = window.NGStore, D = null, F = null;
      if (p.get("fid")) F = S.liste("factures").filter(function (x) { return x.id === p.get("fid"); })[0];
      if (p.get("pid")) { var pa = S.liste("paiements").filter(function (x) { return x.id === p.get("pid"); })[0]; if (pa) F = S.liste("factures").filter(function (x) { return x.id === pa.factureId; })[0]; }
      if (p.get("id")) D = S.demandes().filter(function (x) { return x.id === p.get("id"); })[0];
      var tel = String((F && F.telephone) || (D && D.telephone) || "").replace(/[^\d]/g, ""), em = String((F && F.email) || (D && D.email) || "").toLowerCase();
      var c = S.liste("comptes_clients").filter(function (x) { return (tel && String(x.telephone || "").replace(/[^\d]/g, "") === tel) || (em && x.email === em); })[0];
      var cl = S.liste("clients").filter(function (x) { return (tel && String(x.telephone || "").replace(/[^\d]/g, "") === tel) || (em && String(x.email || "").toLowerCase() === em); })[0];
      l = (c && c.langue) || (cl && cl.langue) || "fr";
    } catch (e) { l = "fr"; }
  }
  window.NG_LANGUE_FORCEE = l;
})();
</script>

<script>
function rendreDocument() {
  var C = window.NG_CONTENU, S = window.NGStore, R = S.reglages(), E = C.entreprise;
  var p = new URLSearchParams(location.search);
  var type = p.get("type") || "devis";
  var out = document.getElementById("doc");
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function argent(n) { return "$\u00a0" + Number(n || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function jour(d) { return d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "—"; }
  var logo = '<img src="' + esc(R.logo) + '" alt="' + esc(E.nom) + '">';
  var coord = esc(R.raisonSociale) + "<br>" + esc(E.adresse) + "<br>RCCM " + esc(R.rccm) + " · Id. Nat. " + esc(R.idnat) + " · NIF " + esc(R.nif) + "<br>" + esc(E.telephone) + " · " + esc(E.email);
  var bloc = '<div class="signs"><div></div><div class="sign"><div class="small">Pour ' + esc(R.raisonSociale) + ', la Direction</div><img class="sig-img" src="' + esc(R.signature) + '" alt="Signature"><img class="seal" src="' + esc(R.sceau) + '" alt="Sceau"><div class="who">' + esc(R.directeur) + ", Directeur général</div></div></div>";
  function entete(titre, num, infos) { return '<div class="band"></div><div class="head"><div><div class="logo">' + logo + '</div><div class="small" style="margin-top:6px">' + coord + '</div></div><div class="title"><h1>' + titre + '</h1><div class="num">' + esc(num) + '</div><div class="small">' + infos + "</div></div></div>"; }
  function modesFacture(F) {
    var m = []; S.liste("paiements").filter(function (p) { return p.factureId === F.id; }).forEach(function (p) { if (m.indexOf(p.mode) < 0) m.push(p.mode); });
    return m.length ? m.join(", ") : (F.modePaiement || "");
  }
  function introuvable() {
    var F0 = window.NG_FIREBASE || {};
    if (F0.apiKey && !window.NGCloud) { out.innerHTML = '<div class="page"><div class="empty"><h1>Chargement du document…</h1><p class="small">Récupération des données en ligne.</p></div></div>'; return; }
    out.innerHTML = '<div class="page"><div class="empty"><h1>Document introuvable</h1><p class="small">' + (window.NGCloud && window.NGCloud.actif ? "Ce document n’existe plus ou a été supprimé." : "Les données en ligne ne sont pas accessibles (" + esc((window.NGCloud && window.NGCloud.erreur) || "mode local") + "). Ouvrez le document depuis l’administration sur cet appareil.") + "</p></div></div>";
  }
  function tableLignes(lignes) { return '<table><thead><tr><th>Désignation</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Montant</th></tr></thead><tbody>' + (lignes.length ? lignes.map(function (l) { return "<tr><td>" + esc(l.designation) + '</td><td class="r">' + l.qte + '</td><td class="r">' + argent(l.pu) + '</td><td class="r">' + argent(l.qte * l.pu) + "</td></tr>"; }).join("") : '<tr><td colspan="4" class="small">Pas encore évalué.</td></tr>') + "</tbody></table>"; }
  function totaux(ht, taux) { var tot = ht * (1 + (Number(taux) || 0) / 100); return '<div class="totals"><div class="ttc"><span>Total</span><span>' + argent(tot) + "</span></div></div>"; }
  function paiement(mode) { return mode ? '<p style="margin-top:16px;font-size:13px"><b>Mode de paiement :</b> ' + esc(mode) + "</p>" : ""; }
  function etudiant() { return S.liste("comptes_etudiants").filter(function (e) { return e.id === p.get("eid"); })[0]; }
  function statsE(e, f) {
    var se = f.seances || [], L = []; (f.modules || []).forEach(function (m) { (m.lecons || []).forEach(function (l) { L.push(l); }); });
    var pres = se.length ? Math.round(se.filter(function (s) { return (s.presents || []).indexOf(e.id) > -1; }).length / se.length * 100) : null;
    var notes = (f.evaluations || []).map(function (ev) { return (e.notes || {})[ev.id]; }).filter(function (n) { return n !== undefined && n !== null && n !== ""; }).map(Number);
    var quiz = Object.keys(e.quiz || {}).map(function (k) { return Number(e.quiz[k]); }), all = notes.length ? notes : quiz;
    return { pres: pres, moy: all.length ? Math.round(all.reduce(function (a, b) { return a + b; }, 0) / all.length) : null, prog: L.length ? Math.round(L.filter(function (l) { return (e.lecons || {})[l.id]; }).length / L.length * 100) : 0, se: se, L: L };
  }

  if (type === "attestation") {
    var e = etudiant(), f = e ? S.formations().filter(function (x) { return x.id === e.formationId; })[0] : null, st = e && f ? statsE(e, f) : null;
    if (p.get("eid") && !e) return introuvable();
    if (e && !(e.attestationAutorisee || (e.attestation && e.attestationAutorisee !== false))) { out.innerHTML = '<div class="page"><div class="empty"><h1>Attestation pas encore autorisée</h1><p class="small">L’attestation sera disponible dès que NextGenIT l’aura validée.</p></div></div>'; return; }
    var nom = e ? e.nom : p.get("nom"), form = f ? f.titre : p.get("formation"), per = f ? "du " + jour(f.debut) + " au " + jour(f.fin) : p.get("periode"), dur = f ? f.duree : p.get("duree"), pres = st ? st.pres : p.get("presence");
    document.title = "Attestation – " + nom;
    var numAtt = (e && e.attestation) || p.get("num") || "";
    var urlVerif = location.href.split("/document.html")[0] + "/verification.html?code=" + encodeURIComponent(numAtt);
    setTimeout(function () { var z = document.getElementById("qr"); if (!z) return; if (window.QRCode && numAtt) { new window.QRCode(z, { text: urlVerif, width: 92, height: 92, colorDark: "#0B1033", colorLight: "#ffffff" }); } else if (numAtt) { z.innerHTML = '<div class="small" style="max-width:140px">Vérification : ' + esc(numAtt) + "</div>"; } }, 400);
    out.innerHTML = '<div class="page paysage"><div class="cert"><div class="head"><div class="logo">' + logo + '</div><div class="small">N° ' + esc((e && e.attestation) || p.get("num") || "ATT-" + new Date().getFullYear() + "-0000") + "</div></div><h1>ATTESTATION DE FORMATION</h1><p class=\"c\">La NextGenIT Academy atteste que</p><div class=\"name\">" + esc(nom) + '</div><p class="c">a suivi avec succès la formation <b>' + esc(form) + "</b><br>" + esc(per) + (dur ? ", soit " + esc(dur) : "") + (pres != null ? ", avec une présence de " + esc(pres) + " %" : "") + (st && st.moy != null ? " et une moyenne de " + st.moy + "/100" : "") + ".</p><p class=\"c small\">Fait à Kolwezi, le " + jour(new Date().toISOString()) + '</p><div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-top:10px"><div id="qr" aria-label="QR code de vérification"></div><div class="small">Scannez pour vérifier<br>l’authenticité de ce document</div></div>' + bloc + "</div></div>";
    return;
  }
  if (type === "frequentation") {
    var e2 = etudiant(); if (!e2) return introuvable();
    var adminConnecte = false; try { adminConnecte = !!sessionStorage.getItem("ng_admin") || Date.now() - Number(localStorage.getItem("nga_admin_ouvert") || 0) < 2 * 3600e3; } catch (er) {}
    if (!e2.frequentationAutorisee && !adminConnecte) { out.innerHTML = '<div class="page"><div class="empty"><h1>Fiche pas encore publiée</h1><p class="small">Votre fiche de fréquentation sera disponible dès que NextGenIT l’aura validée.</p></div></div>'; return; }
    var f2 = S.formations().filter(function (x) { return x.id === e2.formationId; })[0]; if (!f2) return introuvable();
    var s2 = statsE(e2, f2);
    document.title = "Fiche de fréquentation – " + e2.nom;

      '<div class="signs"><div><div class="small">Bon pour accord, le client</div><img class="client-sig" src="' + r.signature + '" alt="Signature du client"><div class="small"><b>' + esc(r.signataire) + "</b> · " + jour(r.creeLe) + '</div></div><div class="sign"><div class="small">Pour ' + esc(R.raisonSociale) + '</div><img class="seal" src="' + esc(R.sceau) + '" alt="Sceau"><div class="who">' + esc(r.technicien) + "</div></div></div></div>";
    return;
  }
  if (type === "facture" || type === "proforma") {
    var F = S.liste("factures").filter(function (x) { return x.id === p.get("fid"); })[0]; if (!F) return introuvable();
    var payeF = S.liste("paiements").filter(function (x) { return x.factureId === F.id; }).reduce(function (a, x) { return a + Number(x.montant); }, 0);
    document.title = (F.type === "proforma" ? "Pro-forma " : "Facture ") + F.numero;
    out.innerHTML = '<div class="page">' + entete(F.type === "proforma" ? "FACTURE PRO-FORMA" : "FACTURE", F.numero, "Date : " + jour(F.emiseLe) + (F.type === "proforma" ? "" : "<br>Échéance : " + jour(F.echeance)) + (F.demandeId ? "<br>Réf. : " + esc(F.demandeId) : "")) +
      '<div class="boxes"><div class="box"><h2>Facturé à</h2><strong>' + esc(F.clientNom) + '</strong><div class="small">' + esc(F.contact && F.contact !== F.clientNom ? F.contact + " · " : "") + esc(F.telephone || "") + "<br>" + esc(F.adresse || "") + '</div></div><div class="box"><h2>Objet</h2><strong>' + esc(F.objet) + "</strong>" + (F.acompte ? '<div class="small">Facture d’acompte (' + F.acompte + " %)</div>" : "") + "</div></div>" + tableLignes(F.lignes) + totaux(F.ht, F.tauxTva) +
      (F.type !== "proforma" && payeF > 0 ? '<div class="totals"><div><span>Déjà payé</span><span>' + argent(payeF) + "</span></div><div><b>Reste à payer</b><b>" + argent(Math.max(0, F.ttc - payeF)) + "</b></div></div>" : "") +
      (F.note ? '<p class="small" style="margin-top:12px"><b>Note :</b> ' + esc(F.note) + "</p>" : "") +
      (F.echeancier && F.echeancier.length ? '<p class="small" style="margin-top:12px"><b>Échéancier :</b> ' + F.echeancier.map(function (x, i) { return "échéance " + (i + 1) + " le " + jour(x.date) + " : " + argent(x.montant); }).join(" · ") + "</p>" : "") +
      paiement(modesFacture(F)) + (F.statut === "payee" ? '<p style="margin-top:14px"><span class="stamp">PAYÉE</span></p>' : F.statut === "annulee" ? '<p style="margin-top:14px"><span class="stamp" style="color:#C62828;border-color:#C62828">ANNULÉE</span></p>' : "") +
      (F.type === "proforma" ? '<p class="small">Facture pro-forma : ce document n’est pas une demande de paiement définitive.</p>' : "") + bloc + '<div class="foot">Merci pour votre confiance · ' + esc(R.raisonSociale) + "</div></div>";
    return;
  }
  /* Devis depuis une demande */
  var d = S.demandes().filter(function (x) { return x.id === p.get("id"); })[0];
  if (!d) return introuvable();
  var st = (d.lignes || []).reduce(function (a, l) { return a + l.qte * l.pu; }, 0);
  var num = "DEV-" + new Date(d.creeLe).getFullYear() + "-" + d.id.replace("NG-", "");
  document.title = "Devis " + num;
  out.innerHTML = '<div class="page">' + entete("DEVIS", num, "Date : " + jour(d.evalueLe || d.creeLe) + " · valable " + esc(d.validite || "15 jours") + "<br>Ticket : " + esc(d.id)) +
    '<div class="boxes"><div class="box"><h2>Client</h2><strong>' + esc(d.entreprise || d.nom) + '</strong><div class="small">' + esc(d.nom) + " · " + esc(d.telephone) + "<br>" + esc(d.adresse || "") + '</div></div><div class="box"><h2>Objet</h2><strong>' + esc((d.services || []).join(", ")) + '</strong><div class="small">' + esc(d.delai ? "Délai d’exécution : " + d.delai : "") + (d.acompte ? "<br>Acompte à la commande : " + d.acompte + " %" : "") + "</div></div></div>" + tableLignes(d.lignes || []) + totaux(st, R.tva) +
    (d.note ? '<p class="small" style="margin-top:16px"><b>Note :</b> ' + esc(d.note) + "</p>" : "") + paiement(d.modePaiement || "") + (d.signatureClient ? '<div class="sig-client"><div class="small"><b>Bon pour accord</b> — signé électroniquement par <b>' + esc(d.signatureClient.nom) + "</b> le " + new Date(d.signatureClient.date).toLocaleString("fr-FR") + '</div><img src="' + d.signatureClient.image + '" alt="Signature du client"></div>' : '<p class="small">Bon pour accord (date, nom et signature du client) :</p>') + bloc + '<div class="foot">Merci pour votre confiance · ' + esc(R.raisonSociale) + "</div></div>";
}
rendreDocument();
window.addEventListener("ng-cloud", rendreDocument);
function occupe() { var f = document.getElementById("badge-form"); return f && !f.hidden; }
window.addEventListener("ng-donnees", function () { if (!occupe()) rendreDocument(); });
window.addEventListener("storage", function (e) { if (e.key && e.key.indexOf("ng_") === 0 && e.key.indexOf("ng_sync") !== 0 && !occupe()) rendreDocument(); });
window.addEventListener("beforeprint", function () { if (!occupe()) rendreDocument(); });
</script>
</body>
